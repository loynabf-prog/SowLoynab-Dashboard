name: Edge Functions einspielen

# Spielt geänderte Supabase Edge Functions automatisch ein, sobald sie auf main
# landen. Ändert sich etwas in _shared/, werden alle Funktionen eingespielt.
# Von Hand: Actions -> "Edge Functions einspielen" -> Run workflow (spielt alle ein).
#
# Braucht das Repo-Secret SUPABASE_ACCESS_TOKEN
# (Supabase -> Account -> Access Tokens, legt Fassie selbst an).

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJEKT: kxrbeyecsdvejhvxtrin
      # Diese Funktionen prüfen den Zugang selbst (Türsteher bzw. Kalender-Schlüssel)
      # und werden von Zeitplänen/Kalender-Apps ohne Login aufgerufen.
      OHNE_JWT: 'calendar-feed fetch-post-links refresh-stats refresh-account-stats posts-abgleich'
      # Liegen im Repo, sind aber (noch) nicht live – nicht automatisch anlegen.
      AUSLASSEN: 'voice-command'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Funktionen einspielen
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::Secret SUPABASE_ACCESS_TOKEN fehlt - Funktionen werden (noch) von Claude direkt eingespielt."
            exit 0
          fi
          ALLE=$(cd supabase/functions && for d in */; do d=${d%/}; [ "$d" != _shared ] && [ -f "$d/index.ts" ] && echo "$d"; done)
          GEAENDERT=$(git diff --name-only HEAD~1 HEAD -- supabase/functions || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "$GEAENDERT" | grep -q '^supabase/functions/_shared/'; then
            LISTE="$ALLE"
          else
            LISTE=$(echo "$GEAENDERT" | cut -d/ -f3 | sort -u)
          fi
          for f in $LISTE; do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            case " $AUSLASSEN " in *" $f "*) echo "überspringe $f"; continue;; esac
            FLAG=""
            case " $OHNE_JWT " in *" $f "*) FLAG="--no-verify-jwt";; esac
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJEKT" $FLAG --use-api
            echo "::endgroup::"
          done
